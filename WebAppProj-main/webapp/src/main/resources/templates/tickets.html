<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css">
</head>
<body>
    <div class="page-container">
        <section class="dashboard-hero">
            <div>
                <h1>Ticket Center</h1>
            </div>
        </section>

        <section class="concert-list">
            <div th:if="${#lists.isEmpty(locations)}" class="dashboard-card">
                <h2>No concerts available</h2>
                <p>There are no concerts at the moment. Please check back after the admin updates.</p>
            </div>

            <article th:each="location : ${locations}" class="concert-card">
                <h3 th:text="${location.city}">City</h3>
                <p><strong>Venue:</strong> <span th:text="${location.venueName}">Venue name</span></p>
                <p>
                    <strong>Date:</strong>
                    <span th:text="${location.concertDate != null} ? ${#temporals.format(location.concertDate, 'MMM d, yyyy - HH:mm')} : 'Date to be announced'">Date</span>
                </p>
                <p><strong>Details:</strong> <span th:text="${location.description}">Description</span></p>
                <p><a th:href="@{/dashboard}">Back to dashboard</a></p>
            </article>
        </section>

        <p style="margin-top: 24px;"><a href="/">Return home</a></p>
    </div>
</body>
</html>
