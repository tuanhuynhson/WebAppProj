<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Tour Merchandise</title>
    
    <link rel="stylesheet" th:href="@{/css/merch.css}">
</head>
<body>

    <header class="merch-header">
        <a th:href="@{/}" class="back-link">&larr; Back to Home</a>
        
        <div class="cart-icon" onclick="toggleCart()">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <div class="merch-container">
        <h2>Official Tour Merchandise</h2>
        <p class="subtitle">Grab your exclusive The Great Returnal gear before they sell out!</p>

        <div class="merch-grid" id="productsGrid"></div>

        <div class="cart-section" id="cartSection" style="display: none;">
            <h2>Your Shopping Cart</h2>
            <div id="cartItems"></div>
            <div class="cart-total">
                Total: $<span id="cartTotal">0.00</span>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Tour T-Shirt', price: 35.00, image: '👕' },
            { id: 2, name: 'Official Lightstick', price: 50.00, image: '🔦' },
            { id: 3, name: 'Signed Poster', price: 20.00, image: '🖼️' }
        ];

        let cart = [];
        
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
            calculateTotal();
            
            // Tự động mở giỏ hàng khi thêm sản phẩm
            document.getElementById('cartSection').style.display = 'block';
        }
        
        function removeFromCart(itemId) {
            cart = cart.filter(item => item.id !== itemId);
            renderCart();
            calculateTotal();
        }
        
        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    renderCart();
                    calculateTotal();
                }
            }
        }
        
        function calculateTotal() {
            let total = 0;
            let totalItems = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                totalItems += item.quantity;
            });
            document.getElementById('cartTotal').textContent = total.toFixed(2);
            document.getElementById('cartCount').textContent = totalItems;
        }
        
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="merch-card">
                    <div class="merch-image">${product.image}</div>
                    <h3>${product.name}</h3>
                    <p class="price">$${product.price.toFixed(2)}</p>
                    <button class="btn-buy" onclick="addToCart(${product.id})">Add to Cart</button>
                </div>
            `).join('');
        }
        
        function renderCart() {
            const cartItemsContainer = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="padding: 10px 0; color: #666;">Your cart is empty.</p>';
                return;
            }
            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <span class="item-icon">${item.image}</span> 
                        <span class="item-name">${item.name}</span> 
                        <span class="item-price">-$${item.price.toFixed(2)}</span>
                    </div>
                    <div class="quantity-controls">
                        <button onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span class="qty">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})">Remove</button>
                    </div>
                </div>
            `).join('');
        }
        
        function toggleCart() {
            const cartSection = document.getElementById('cartSection');
            cartSection.style.display = cartSection.style.display === 'none' ? 'block' : 'none';
        }
        
        // Khởi tạo giao diện
        renderProducts();
        renderCart();
        calculateTotal();
    </script>
</body>
</html>
