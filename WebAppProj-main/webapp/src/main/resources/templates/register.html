<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}" href="/css/register.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Create a New Account</h2>
            <p>Fill in the information below to become a member.</p>
            <p id="error-message" style="color: red; text-align: center; display: none; font-weight: bold; margin-top: 20px;"></p>
            
            <form id="registerForm" action="/register" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="6">
                </div>
                
                <button type="submit" class="btn-submit">Register Account</button>
            </form>


            <p style="margin-top: 25px; font-size: 0.95rem; color: #666;">
                Already have an account? 
                <a href="/login" style="color: #e94560; font-weight: bold;">Login here</a>
            </p>
                <p style="margin-top: 25px; font-size: 0.95rem; color: #666;">
                Already have an account? 
                <a href="/login" style="color: #e94560; font-weight: bold;">Login here</a>
            </p>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const errorType = urlParams.get('error');
        const errorMsgElement = document.getElementById('error-message');

        if (errorType === 'password_mismatch') {
            errorMsgElement.innerText = "Passwords do not match.";
            errorMsgElement.style.display = "block";
        } else if (errorType === 'email_exists') {
            errorMsgElement.innerText = "Email already exists. Please use another address.";
            errorMsgElement.style.display = "block";
        }
    </script>
</body>
</html>
