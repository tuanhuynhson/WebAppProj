<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css" />
</head>
<body class="login-page">
    <main class="login-stage" aria-label="Login">
        <section class="login-orbit">
            <form class="login-form" action="/login" method="post">
                <a class="login-home-link" th:href="@{/}" href="/">&lt; Return to Home</a>
                <h1>LOG IN</h1>
                <p id="error-message" class="login-error" hidden></p>

                <label class="visually-hidden" for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="EMAIL" required autocomplete="email" />

                <label class="visually-hidden" for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="PASSWORD" required autocomplete="current-password" />

                <p class="login-register">Don't have an account? <a th:href="@{/register}" href="/register">Register instead</a></p>
                <button type="submit">LOGIN</button>
            </form>
        </section>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const errorType = urlParams.get("error");
        const errorMsgElement = document.getElementById("error-message");

        if (errorType === "login_required") {
            errorMsgElement.innerText = "You need to login to your account.";
            errorMsgElement.hidden = false;
        } else if (errorType === "invalid") {
            errorMsgElement.innerText = "Invalid email or password. Please try again.";
            errorMsgElement.hidden = false;
        }
    </script>
</body>
</html>
