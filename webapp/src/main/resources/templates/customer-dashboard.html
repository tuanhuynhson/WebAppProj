<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128+Text&family=Libre+Caslon+Display&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css" />
</head>
<body class="customer-dashboard-page">
    <main class="customer-dashboard-shell" aria-label="Customer dashboard">
        <section class="customer-oval-hero" aria-label="Customer greeting">
            <div class="customer-oval-content">
                <p>Hello,</p>
                <h1 th:text="${userFullName}">Customer</h1>
            </div>
        </section>

        <section class="dashboard-lists" aria-label="Customer activity">
            <article class="dashboard-list-panel dashboard-ticket-panel">
                <div class="dashboard-list-heading">
                    <h2>MY TICKET</h2>
                    <a th:href="@{/}" href="/">Buy Ticket</a>
                </div>

                <div class="dashboard-items" th:if="${!#lists.isEmpty(ownedTickets)}">
                    <div class="dashboard-item" th:each="ticket : ${ownedTickets}">
                        <div>
                            <strong th:text="${ticket.city}">City</strong>
                            <p>
                                <span th:text="${ticket.venueName}">Venue</span>
                                <span> | </span>
                                <span th:text="${ticket.concertDate}">Date</span>
                            </p>
                        </div>
                        <span class="dashboard-pill" th:text="${ticket.seatLabel}">Seat A1</span>
                    </div>
                </div>

                <div class="dashboard-empty" th:if="${#lists.isEmpty(ownedTickets)}">
                    <p>No tickets yet.</p>
                </div>
            </article>

            <article class="dashboard-list-panel dashboard-merch-panel">
                <div class="dashboard-list-heading">
                    <h2>MY MERCH</h2>
                    <a th:href="@{/merch}" href="/merch">Shop Merch</a>
                </div>

                <div class="dashboard-items" th:if="${!#lists.isEmpty(ownedMerch)}">
                    <div class="dashboard-item" th:each="order : ${ownedMerch}">
                        <div>
                            <strong th:text="${order.summary}">Merch order</strong>
                            <p th:text="${order.total}">$0.00</p>
                        </div>
                        <span class="dashboard-pill" th:text="${order.status}">Paid</span>
                    </div>
                </div>

                <div class="dashboard-empty" th:if="${#lists.isEmpty(ownedMerch)}">
                    <p>No merch yet.</p>
                </div>
            </article>
        </section>

        <a class="dashboard-signout" th:href="@{/logout}" href="/logout">Sign out</a>
    </main>
</body>
</html>
