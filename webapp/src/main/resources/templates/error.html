<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css" />
</head>
<body>
    <div class="page-container">
        <section class="dashboard-hero">
            <div>
                <h1>Oops — Something went wrong</h1>
                <p>We have recorded the issue. Please try again or return to the homepage.</p>
            </div>
        </section>

        <section class="dashboard-card">
            <h2 th:text="${status}">Error status</h2>
            <p><strong th:text="${error}">Error</strong></p>
            <p th:text="${message}">Error description</p>
            <p><strong>Path:</strong> <span th:text="${path}">/path</span></p>
        </section>

        <p style="margin-top: 24px;"><a class="dashboard-cta" href="/">Return to homepage</a></p>
    </div>
</body>
</html>
