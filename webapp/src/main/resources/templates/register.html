<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/register.css}" href="/css/register.css" />
</head>
<body class="login-page register-page">
    <main class="login-stage" aria-label="Register">
        <section class="login-orbit">
            <form class="login-form" action="/register" method="post">
                <a class="login-home-link" th:href="@{/}" href="/">&lt; Return to Home</a>
                <h1>REGISTER</h1>
                <p id="error-message" class="login-error" hidden></p>

                <label class="visually-hidden" for="fullname">Full Name</label>
                <input id="fullname" name="fullname" type="text" placeholder="FULL NAME" required autocomplete="name" />

                <label class="visually-hidden" for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="EMAIL" required autocomplete="email" />

                <label class="visually-hidden" for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="PASSWORD" required minlength="6" autocomplete="new-password" />

                <label class="visually-hidden" for="confirm_password">Confirm Password</label>
                <input id="confirm_password" name="confirm_password" type="password" placeholder="CONFIRM" required minlength="6" autocomplete="new-password" />

                <p class="login-register">Already have an account? <a th:href="@{/login}" href="/login">Login instead</a></p>
                <button type="submit">REGISTER</button>
            </form>
        </section>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const errorType = urlParams.get("error");
        const errorMsgElement = document.getElementById("error-message");

        if (errorType === "password_mismatch") {
            errorMsgElement.innerText = "Passwords do not match.";
            errorMsgElement.hidden = false;
        } else if (errorType === "email_exists") {
            errorMsgElement.innerText = "Email already exists. Please use another address.";
            errorMsgElement.hidden = false;
        }
    </script>
</body>
</html>
